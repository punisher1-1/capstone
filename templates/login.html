<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerSpaceHub — Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 360px;
        }
        h1 {
            margin: 0 0 1.5rem 0;
            font-size: 1.5rem;
            color: #333;
        }
        label {
            display: block;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
            color: #555;
        }
        input {
            width: 100%;
            padding: 0.6rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.7rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        .message {
            margin-top: 1rem;
            padding: 0.6rem;
            border-radius: 4px;
            font-size: 0.9rem;
            display: none;
        }
        .message.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }
        .message.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        .hint {
            font-size: 0.8rem;
            color: #888;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>MakerSpaceHub Login</h1>
        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Log in</button>
        </form>
        <div id="message" class="message"></div>
        <p class="hint">Demo credentials: <code>admin</code> / <code>makerspace2026</code></p>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const formData = new FormData(form);
    try {
        const response = await fetch('/login', {
            method: 'POST',
            body: formData,
            credentials: 'same-origin'   // ensure the Set-Cookie response is honored
        });
        const data = await response.json();
        if (response.ok) {
            message.className = 'message success';
            message.textContent = data.message + ' — redirecting…';
            // Brief pause so the user sees the success state, then go to admin
            setTimeout(() => {
                window.location.href = data.redirect || '/admin';
            }, 600);
        } else {
            message.className = 'message error';
            message.textContent = data.detail || 'Login failed';
        }
    } catch (err) {
        message.className = 'message error';
        message.textContent = 'Network error: ' + err.message;
    }
});
    </script>
</body>
</html>
